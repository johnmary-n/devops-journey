name: DevSecOps Automation & Security Pipeline

on:
  push:
    branches: [ main ]

# 🔑 CRITICAL: Grant the runner permission to request a cryptographic OIDC ID token
permissions:
  id-token: write
  contents: read

jobs:
  security-and-cloud-auth:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull the codebase onto the cloud runner
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step 2: Automated Secret Scanning (SAST Security Gate)
      - name: Execute Credential & Secret Leak Scan
        run: |
          echo "=== STARTING STATIC APPLICATION SECURITY TESTING (SAST) ==="
          if grep -rqi --exclude-dir=.git --exclude-dir=.github "password\|secret_key\|private_key\|aws_token" .; then
            echo "❌ CRITICAL SECURITY FAILURE: Hardcoded credentials detected!"
            exit 1
          else
            echo "✅ SECURE: No cleartext credentials exposed."
          fi

      # Step 3: Authenticate to Microsoft Azure via Passwordless OIDC Trust
      - name: Log In to Microsoft Azure (OIDC Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true  # Allows bare tenant identity management

      # Step 4: Verify the Identity Pipeline Connection
      - name: Execute Live Cloud Directory Verification
        run: |
          echo "=== CONNECTED TO MICROSOFT AZURE OIDC ==="
          echo "Current active security context identity:"
          az account show --query "{TenantID:tenantId, Environment:environmentName}" --output table
