apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
  labels:
    app: capstone-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-api
  template:
    metadata:
      labels:
        app: capstone-api
      annotations:
        # Prometheus Auto-Scraping Annotations
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: capstone-api
        image: capstone-api:v1
        imagePullPolicy: IfNotPresent  # Uses the local image we built with Docker
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-api-service
spec:
  type: ClusterIP
  selector:
    app: capstone-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
